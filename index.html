document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

· 24 horas presenciales<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:7px;background:rgba(243,103,34,.16);border:1px solid rgba(242,103,34,.5);color:#FFC9A6;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700\">👥 Solo 12 cupos<\u002Fspan>\n      <\u002Fdiv>\n\n      <p style=\"margin:20px 0 0;font-size:13px;color:rgba(255,255,255,.62);line-height:1.5\">Solo 12 cupos · Cupo reducido por diseño metodológico.<sc-if value=\"{{ showSpots }}\" hint-placeholder-val=\"{{ false }}\"><strong style=\"color:#F5C400\"> Quedan {{ spotsText }} de 12.<\u002Fstrong><\u002Fsc-if><\u002Fp>\n\n      <blockquote style=\"margin:26px 0 0;padding:18px 20px;background:rgba(123,46,142,.18);border:1px solid rgba(163,94,182,.45);border-radius:10px\">\n        <p style=\"margin:0;font-size:clamp(15px,3vw,18px);font-style:italic;line-height:1.5;color:#F2E9F6\">“La respuesta ya vive en el sistema. Tu trabajo es construir el espacio donde pueda mostrarse.”<\u002Fp>\n        <footer style=\"margin-top:10px;font-size:13px;font-weight:700;color:#D6B7E2;font-style:normal\">— Betsy Martínez Montero, Trainer<\u002Ffooter>\n      <\u002Fblockquote>\n\n      <div style=\"margin-top:30px\">\n        <a href=\"{{ ctaHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-align:center;background:#E3000F;color:#fff;font-family:'Archivo Black',sans-serif;font-size:clamp(15px,3.4vw,19px);letter-spacing:.01em;padding:20px 26px;border-radius:8px;text-decoration:none;box-shadow:0 4px 0 #9E000B;text-transform:uppercase\" style-hover=\"background:#FF1A25;color:#fff;transform:translateY(-1px)\">Reservar mi cupo fundador · $570 USD<\u002Fa>\n        <p style=\"margin:12px 0 0;text-align:center;font-size:13px;color:rgba(255,255,255,.7);line-height:1.55\">Precio fundador <strong style=\"color:#fff\">$970 USD<\u002Fstrong> reservando antes del 15 de agosto · Tarifa normal $1.270 USD<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative\">\n      <div style=\"border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:#0E2440;aspect-ratio:16/9;display:flex;flex-direction:column\">\n        <div style=\"display:flex;height:12px;width:100%\">\n          <div style=\"flex:1;background:#E3000F\"><\u002Fdiv><div style=\"flex:1;background:#F5C400\"><\u002Fdiv><div style=\"flex:1;background:#0B6FBF\"><\u002Fdiv><div style=\"flex:1;background:#00963F\"><\u002Fdiv><div style=\"flex:1;background:#F26722\"><\u002Fdiv><div style=\"flex:1;background:#7B2E8E\"><\u002Fdiv>\n        <\u002Fdiv>\n        <img src=\"assets\u002Ffoto-hero.jpg\" alt=\"Sesión real de LEGO Serious Play: mesa llena de piezas y manos construyendo\" style=\"flex:1 1 auto;width:100%;height:100%;min-height:0;object-fit:cover;object-position:center;display:block\" loading=\"eager\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#F7F8FA;padding:clamp(48px,8vw,92px) 18px\">\n  <div style=\"max-width:820px;margin:0 auto\">\n    <p style=\"margin:0 0 14px;font-size:12px;font-weight:800;letter-spacing:.15em;color:#7B2E8E\">ANTES DE HABLAR DE CONTENIDOS, HABLEMOS DE TI<\u002Fp>\n    <h2 style=\"margin:0 0 26px;font-family:'Archivo Black',sans-serif;font-size:clamp(27px,5.6vw,44px);line-height:1.06;letter-spacing:-.01em;color:#091A30\">Has facilitado muchas sesiones. ¿Cuántas se sostienen en el tiempo?<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:clamp(16px,3.1vw,18px);line-height:1.65;color:#33415C\">Conoces la escena. Sala llena, presentación impecable, participantes que asienten. Y tres semanas después, todo sigue exactamente igual — o cambia algo, pero no se sostiene como te gustaría.<\u002Fp>\n    <p style=\"margin:0 0 30px;font-size:clamp(16px,3.1vw,18px);line-height:1.65;color:#33415C\">No es tu experiencia ni tu trayectoria. El problema es estructural: cuando las personas solo escuchan, opinan desde su lugar de siempre. Los mismos hablan, los mismos callan, y la conversación real — la que importa — nunca ocurre.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px;align-items:start\">\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-top:5px solid #7B2E8E;border-radius:10px;padding:24px\">\n        <h3 style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.04em;color:#7B2E8E;line-height:1.3\">LO QUE CAMBIA CUANDO CONSTRUYEN CON LAS MANOS<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.62;color:#33415C\">El pensamiento metafórico enfrenta las defensas del ego. Un participante puede decir con ladrillos lo que jamás diría con palabras. Y una vez que ese modelo está sobre la mesa, ya no se puede desdecir: el sistema quedó visible para todos, incluido para quien lo construyó.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-radius:10px;overflow:hidden;border:1px solid #E4E7EC;background:#0E2440;aspect-ratio:3/2;display:flex;flex-direction:column\">\n        <div style=\"display:flex;height:10px;width:100%\">\n          <div style=\"flex:1;background:#E3000F\"><\u002Fdiv><div style=\"flex:1;background:#F5C400\"><\u002Fdiv><div style=\"flex:1;background:#0B6FBF\"><\u002Fdiv><div style=\"flex:1;background:#00963F\"><\u002Fdiv>\n        <\u002Fdiv>\n        <img src=\"assets\u002Ffoto-problema.jpg\" alt=\"Manos construyendo un modelo con piezas LEGO\" style=\"flex:1 1 auto;width:100%;height:100%;min-height:0;object-fit:cover;object-position:center;display:block\" loading=\"lazy\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:30px 0 0;font-size:clamp(16px,3.1vw,19px);font-style:italic;line-height:1.6;color:#091A30;border-left:4px solid #F5C400;padding-left:18px\">En esta certificación no vas a aprender Coaching convencional. Vas a construir, entre manos y mente, la manera de acompañar negocios y equipos que nadie más está ofreciendo en la región.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#fff;padding:clamp(48px,8vw,92px) 18px;border-top:1px solid #EAECF0\">\n  <div style=\"max-width:1000px;margin:0 auto\">\n    <h2 style=\"margin:0 0 22px;font-family:'Archivo Black',sans-serif;font-size:clamp(26px,5.2vw,40px);line-height:1.08;color:#091A30\">Quién respalda esta certificación<\u002Fh2>\n    <p style=\"margin:0 0 40px;font-size:clamp(16px,3.1vw,18px);line-height:1.65;color:#33415C;max-width:72ch\">Esta es una metodología nueva — el IRIS Coaching Model™ aplicado junto a LEGO® SERIOUS PLAY® — lanzada por Humanos con Recursos y su creadora, Betsy Martínez Montero. No nace de la nada: nace de más de 9 años certificando facilitadores en LEGO® SERIOUS PLAY® en toda Latinoamérica y de más de 15 años acompañando negocios y equipos como Coach Corporativa.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px\">\n      <div style=\"border-top:6px solid #E3000F;background:#F7F8FA;border-radius:0 0 10px 10px;padding:26px 22px\">\n        <p style=\"margin:0;font-family:'Archivo Black',sans-serif;font-size:clamp(38px,7vw,54px);line-height:1;color:#091A30\">+9<\u002Fp>\n        <p style=\"margin:10px 0 0;font-size:15px;line-height:1.5;color:#475467;font-weight:600\">años sumando facilitadores LSP® en la región<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:6px solid #0B6FBF;background:#F7F8FA;border-radius:0 0 10px 10px;padding:26px 22px\">\n        <p style=\"margin:0;font-family:'Archivo Black',sans-serif;font-size:clamp(38px,7vw,54px);line-height:1;color:#091A30\">2015<\u002Fp>\n        <p style=\"margin:10px 0 0;font-size:15px;line-height:1.5;color:#475467;font-weight:600\">año desde el que HCR lidera certificaciones de aprendizaje activo en Latinoamérica<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:6px solid #00963F;background:#F7F8FA;border-radius:0 0 10px 10px;padding:26px 22px\">\n        <p style=\"margin:0;font-family:'Archivo Black',sans-serif;font-size:clamp(38px,7vw,54px);line-height:1;color:#091A30\">+1.000<\u002Fp>\n        <p style=\"margin:10px 0 0;font-size:15px;line-height:1.5;color:#475467;font-weight:600\">profesionales certificados en diferentes cohortes en todo LATAM<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#F7F8FA;padding:clamp(48px,8vw,92px) 18px;border-top:1px solid #EAECF0\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <h2 style=\"margin:0 0 34px;font-family:'Archivo Black',sans-serif;font-size:clamp(26px,5.2vw,40px);line-height:1.08;color:#091A30;max-width:20ch\">Lo que dicen quienes ya se certificaron con Betsy<\u002Fh2>\n\n    <div style=\"border-radius:12px;overflow:hidden;border:1px solid #E4E7EC;background:#0E2440;aspect-ratio:16/9;max-height:300px;display:flex;flex-direction:column;margin-bottom:30px\">\n      <div style=\"display:flex;height:12px;width:100%\">\n        <div style=\"flex:1;background:#E3000F\"><\u002Fdiv><div style=\"flex:1;background:#F5C400\"><\u002Fdiv><div style=\"flex:1;background:#0B6FBF\"><\u002Fdiv><div style=\"flex:1;background:#00963F\"><\u002Fdiv><div style=\"flex:1;background:#F26722\"><\u002Fdiv><div style=\"flex:1;background:#7B2E8E\"><\u002Fdiv>\n      <\u002Fdiv>\n      <img src=\"assets\u002Ffoto-respaldo.jpg\" alt=\"Grupo certificado en un workshop de LEGO Serious Play con Betsy Martínez\" style=\"flex:1 1 auto;width:100%;height:100%;min-height:0;object-fit:cover;object-position:center 30%;display:block\" loading=\"lazy\">\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px\">\n      <figure style=\"margin:0;background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-family:'Archivo Black',sans-serif;font-size:34px;line-height:.6;color:#E3000F\">“<\u002Fspan>\n        <blockquote style=\"margin:0;font-size:15.5px;line-height:1.62;color:#33415C;font-style:italic\">Como consultor independiente, he visto crecer mi oferta de valor en el mercado gracias a la certificación tomada con Humanos con Recursos. Con 2 workshops recuperé la inversión realizada; sin duda ha sido de las mejores inversiones que he hecho.<\u002Fblockquote>\n        <figcaption style=\"margin-top:auto;font-size:14px;line-height:1.5;color:#091A30\"><strong>Antonio Góngora<\u002Fstrong><br><span style=\"color:#667085\">Consultor Empresarial, Guatemala<\u002Fspan><\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure style=\"margin:0;background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-family:'Archivo Black',sans-serif;font-size:34px;line-height:.6;color:#0B6FBF\">“<\u002Fspan>\n        <blockquote style=\"margin:0;font-size:15.5px;line-height:1.62;color:#33415C;font-style:italic\">He tomado 3 diferentes certificaciones con Humanos con Recursos, una decisión que me ha permitido liderar el área de capacitación en la empresa con herramientas innovadoras y efectivas. Recomiendo la empresa 100% y a Betsy Martínez como una de las referentes más reconocidas en el aprendizaje experiencial.<\u002Fblockquote>\n        <figcaption style=\"margin-top:auto;font-size:14px;line-height:1.5;color:#091A30\"><strong>Johanna Céspedes<\u002Fstrong><br><span style=\"color:#667085\">Sector Retail, Costa Rica<\u002Fspan><\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure style=\"margin:0;background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-family:'Archivo Black',sans-serif;font-size:34px;line-height:.6;color:#00963F\">“<\u002Fspan>\n        <blockquote style=\"margin:0;font-size:15.5px;line-height:1.62;color:#33415C;font-style:italic\">No estaba tan seguro si certificarme iba a hacer la diferencia en mis servicios; dudé al principio por la inversión. Hablé con la Trainer, Betsy Martínez, y me inspiró confianza. Hoy puedo decir que ha sido una de las decisiones profesionales más acertadas que he tomado, y feliz de haber transformado tanto mis talleres como mis intervenciones en coaching de equipos.<\u002Fblockquote>\n        <figcaption style=\"margin-top:auto;font-size:14px;line-height:1.5;color:#091A30\"><strong>Alex Conejo<\u002Fstrong><br><span style=\"color:#667085\">Coach Ejecutivo, Nicaragua<\u002Fspan><\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:34px;background:#091A30;border-radius:12px;padding:clamp(24px,4vw,38px);color:#fff\">\n      <h3 style=\"margin:0 0 22px;font-family:'Archivo Black',sans-serif;font-size:clamp(16px,3.4vw,21px);letter-spacing:.03em;color:#F5C400;line-height:1.25\">POR QUÉ SER PRIMERA GENERACIÓN JUEGA A TU FAVOR<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px\">\n        <div style=\"border-left:3px solid #E3000F;padding-left:14px\">\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.85)\"><strong style=\"color:#fff\">Tu certificado dirá Primera Generación.<\u002Fstrong> Cuando el IRIS Coaching Model™ ya no sea un lanzamiento en la región, tú estuviste en la Generación Fundadora como Coach IRIS™.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-left:3px solid #F5C400;padding-left:14px\">\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.85)\"><strong style=\"color:#fff\">Precio fundador.<\u002Fstrong> Esta inversión de lanzamiento no se repetirá en futuras cohortes.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-left:3px solid #00963F;padding-left:14px\">\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.85)\"><strong style=\"color:#fff\">Acceso directo a la autora.<\u002Fstrong> Grupo de máximo 12 personas, acompañadas por quien creó el modelo — no por un trainer licenciado.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"{{ ctaHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:26px;background:#E3000F;color:#fff;font-family:'Archivo Black',sans-serif;font-size:15px;padding:16px 26px;border-radius:8px;text-decoration:none;box-shadow:0 4px 0 #9E000B;text-transform:uppercase\" style-hover=\"background:#FF1A25;color:#fff\">Quiero ser Primera Generación<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"programa\" style=\"background:#091A30;color:#fff;padding:clamp(48px,8vw,92px) 18px\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <div style=\"display:flex;height:10px;width:120px;margin-bottom:26px;border-radius:2px;overflow:hidden\">\n      <div style=\"flex:1;background:#E3000F\"><\u002Fdiv><div style=\"flex:1;background:#F5C400\"><\u002Fdiv><div style=\"flex:1;background:#0B6FBF\"><\u002Fdiv><div style=\"flex:1;background:#00963F\"><\u002Fdiv>\n    <\u002Fdiv>\n    <h2 style=\"margin:0 0 18px;font-family:'Archivo Black',sans-serif;font-size:clamp(26px,5.2vw,42px);line-height:1.08\">Qué vas a obtener en 3 días<\u002Fh2>\n    <p style=\"margin:0 0 34px;font-size:clamp(16px,3.1vw,18px);line-height:1.65;color:rgba(255,255,255,.78);max-width:70ch\">Te certificas como Business &amp; Team Coach con la Metodología LEGO® SERIOUS PLAY®, con un sistema propio y completo para acompañar procesos de Coaching de Negocios y de Equipos en el mercado corporativo, docencia, entre otros.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:18px\">\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:24px\">\n        <p style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:30px;line-height:1;color:#E3000F\">01<\u002Fp>\n        <h3 style=\"margin:0 0 9px;font-size:17px;font-weight:800\">Un método propio<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(255,255,255,.78)\">El IRIS Coaching Model™ de la Coach de Negocios Betsy Martínez M. Cuatro fases que te dan estructura para cualquier sesión, proyecto, cliente e industria.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:24px\">\n        <p style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:30px;line-height:1;color:#F5C400\">02<\u002Fp>\n        <h3 style=\"margin:0 0 9px;font-size:17px;font-weight:800\">Dos marcos de negocio<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(255,255,255,.78)\">EOS (Entrepreneurial Operating System) de Gino Wickman para diagnosticar la empresa y su ecosistema; Thinking Environment de Nancy Kline para sostener la conversación como Coach de Equipos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:24px\">\n        <p style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:30px;line-height:1;color:#0B6FBF\">03<\u002Fp>\n        <h3 style=\"margin:0 0 9px;font-size:17px;font-weight:800\">Práctica real<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(255,255,255,.78)\">Trabajas tu propio caso o el de un cliente real durante los tres días. No sales con teoría: sales con una intervención avanzada, entrenado/a para ver lo que “el sistema quiere mostrar”.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:24px\">\n        <p style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:30px;line-height:1;color:#00963F\">04<\u002Fp>\n        <h3 style=\"margin:0 0 9px;font-size:17px;font-weight:800\">Certificación con demo<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(255,255,255,.78)\">Te certificas facilitando frente al grupo, evaluado/a con rúbrica internacional de tres ejes: dominio del proceso, calidad de las preguntas y postura de coach. Sin trabajos post-certificación.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin:46px 0 20px;font-family:'Archivo Black',sans-serif;font-size:clamp(18px,3.6vw,24px);line-height:1.2;color:#F5C400\">Los tres principios que hacen esta certificación diferente<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n      <div style=\"border-top:4px solid #F26722;padding-top:14px\">\n        <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.82)\"><strong style=\"color:#fff\">100% de participación, 100% del tiempo.<\u002Fstrong> Nadie se esconde detrás del que más habla. Todos construyen, todos comparten.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #7B2E8E;padding-top:14px\">\n        <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.82)\"><strong style=\"color:#fff\">La historia la cuenta quien construye.<\u002Fstrong> Nadie interpreta el modelo de otro. Esto elimina el juicio y libera el pensamiento honesto.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #0B6FBF;padding-top:14px\">\n        <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.82)\"><strong style=\"color:#fff\">El coach pregunta al modelo, no a la persona.<\u002Fstrong> La diferencia entre explorar y juzgar. El Coach se convierte en el Thinking Partner de su cliente o equipo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:40px;background:rgba(11,111,191,.14);border:1px solid rgba(11,111,191,.4);border-radius:10px;padding:clamp(22px,3.5vw,30px)\">\n      <h3 style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:clamp(15px,3.2vw,19px);letter-spacing:.02em;line-height:1.3\">Por qué LEGO® SERIOUS PLAY® y no otra metodología<\u002Fh3>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.65;color:rgba(255,255,255,.82)\">Nació en 1996 en el IMD de Suiza, cuando los profesores Johan Roos y Bart Victor trabajaron con el dueño del Grupo LEGO® para resolver un problema concreto: las sesiones de estrategia eran predecibles y sin imaginación. En 2010, LEGO Group liberó la metodología bajo modelo Open Source. Esta certificación se construye sobre ese origen académico riguroso, no sobre versiones comerciales posteriores.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#fff;padding:clamp(48px,8vw,92px) 18px\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <h2 style=\"margin:0 0 34px;font-family:'Archivo Black',sans-serif;font-size:clamp(26px,5.2vw,42px);line-height:1.08;color:#091A30\">¿Esta certificación es para ti?<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px\">\n      <div style=\"background:#F2FAF5;border:1px solid #BCE5CC;border-radius:12px;padding:26px\">\n        <h3 style=\"margin:0 0 18px;font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.05em;color:#00713A\">SÍ, SI ERES…<\u002Fh3>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:13px\">\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#00963F;font-weight:800;flex:none\">✓<\u002Fspan>Coach ejecutivo o de equipos que quiere diferenciarse en un mercado saturado.<\u002Fli>\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#00963F;font-weight:800;flex:none\">✓<\u002Fspan>Consultor/a que busca herramientas de intervención con impacto medible y disruptivo.<\u002Fli>\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#00963F;font-weight:800;flex:none\">✓<\u002Fspan>Facilitador/a que ya trabaja con grupos y quiere profundidad metodológica.<\u002Fli>\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#00963F;font-weight:800;flex:none\">✓<\u002Fspan>Líder de RR.HH. o Desarrollo Organizacional que diseña programas internos.<\u002Fli>\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#00963F;font-weight:800;flex:none\">✓<\u002Fspan>Docente o formador que quiere sacar a su grupo del modo pasivo.<\u002Fli>\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#00963F;font-weight:800;flex:none\">✓<\u002Fspan>Líder de equipo que necesita conversaciones difíciles que sí avancen.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#FDF3F3;border:1px solid #F2C7C7;border-radius:12px;padding:26px\">\n        <h3 style=\"margin:0 0 18px;font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.05em;color:#B00010\">NO, SI BUSCAS…<\u002Fh3>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:13px\">\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#E3000F;font-weight:800;flex:none\">✕<\u002Fspan>Un diploma rápido para colgar en la pared sin practicar ni desafiarte.<\u002Fli>\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#E3000F;font-weight:800;flex:none\">✕<\u002Fspan>Una metodología para “animar” reuniones y romper el hielo.<\u002Fli>\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#E3000F;font-weight:800;flex:none\">✕<\u002Fspan>Certificarte sin exponerte a facilitar frente a otros.<\u002Fli>\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#E3000F;font-weight:800;flex:none\">✕<\u002Fspan>Recetas cerradas en lugar de un método que debes adaptar.<\u002Fli>\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#E3000F;font-weight:800;flex:none\">✕<\u002Fspan>Formarte como implementador de EOS: aquí EOS es mapa de diagnóstico, no de implementación.<\u002Fli>\n          <li style=\"display:flex;gap:11px;font-size:15.5px;line-height:1.55;color:#2C3E50\"><span style=\"color:#E3000F;font-weight:800;flex:none\">✕<\u002Fspan>Seguir siendo un Coach/Líder tradicional sin atreverte a llevar lo inconsciente a lo consciente.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:26px;align-items:stretch\">\n      <div style=\"background:#FFF6EF;border:1px solid #FAD2B4;border-left:5px solid #F26722;border-radius:10px;padding:26px\">\n        <h3 style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.03em;color:#B54708;line-height:1.35\">NO NECESITAS EXPERIENCIA PREVIA CON LEGO® SERIOUS PLAY®<\u002Fh3>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.62;color:#33415C\">El Día 1 abre con dos construcciones de calentamiento diseñadas para que desarrolles la habilidad desde cero. Lo que sí necesitas es cierta experiencia acompañando personas o equipos: esta certificación te da el método, no la vocación.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-radius:10px;overflow:hidden;border:1px solid #E4E7EC;background:#0E2440;min-height:220px;display:flex;flex-direction:column\">\n        <div style=\"display:flex;height:10px;width:100%\">\n          <div style=\"flex:1;background:#F26722\"><\u002Fdiv><div style=\"flex:1;background:#F5C400\"><\u002Fdiv><div style=\"flex:1;background:#7B2E8E\"><\u002Fdiv><div style=\"flex:1;background:#00963F\"><\u002Fdiv>\n        <\u002Fdiv>\n        <img src=\"assets\u002Ffoto-espara-ti.jpg\" alt=\"Participante construyendo su modelo durante una sesión\" style=\"flex:1 1 auto;width:100%;height:100%;min-height:0;object-fit:cover;object-position:center;display:block\" loading=\"lazy\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:30px 0 0;font-size:clamp(16px,3.1vw,19px);font-style:italic;line-height:1.6;color:#091A30;border-left:4px solid #0B6FBF;padding-left:18px;max-width:72ch\">Si llevas años facilitando y sientes que te falta una estructura que sostenga lo que intuyes, estos tres días son exactamente para ti.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#F7F8FA;padding:clamp(48px,8vw,92px) 18px;border-top:1px solid #EAECF0\">\n  <div style=\"max-width:1000px;margin:0 auto\">\n    <h2 style=\"margin:0 0 16px;font-family:'Archivo Black',sans-serif;font-size:clamp(26px,5.2vw,42px);line-height:1.08;color:#091A30\">Tus 3 marcos de aprendizaje<\u002Fh2>\n    <p style=\"margin:0 0 30px;font-size:clamp(16px,3.1vw,18px);line-height:1.65;color:#33415C;max-width:70ch\">Tres modelos propios que se integran entre sí. No aprendes teorías sueltas: aprendes un sistema donde cada pieza sostiene a la siguiente.<\u002Fp>\n\n    <div style=\"background:#fff;border:1px solid #E4E7EC;border-top:5px solid #0B6FBF;border-radius:10px;padding:26px;margin-bottom:34px\">\n      <h3 style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.04em;color:#0B4FA8\">CÓMO SE CONECTAN LOS TRES MARCOS<\u002Fh3>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.62;color:#33415C\">El IRIS Coaching Model™ es el proceso: las cuatro fases que estructuran cualquier sesión. El Marco Sistémico de Business Coaching Integrado™ es la lente para leer el sistema de la empresa. El Team Coaching Model Integrado™ es la misma lente aplicada a un equipo.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"margin:0 0 18px;font-family:'Archivo Black',sans-serif;font-size:clamp(18px,3.6vw,24px);color:#091A30\">Las 4 fases que vas a dominar<\u002Fh3>\n    <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:38px\">\n      <div style=\"display:flex;align-items:center;gap:18px;background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:16px 18px\">\n        <span style=\"flex:none;width:52px;height:52px;border-radius:8px;background:#E3000F;color:#fff;font-family:'Archivo Black',sans-serif;font-size:26px;display:flex;align-items:center;justify-content:center\">I<\u002Fspan>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">IDENTITY<\u002Fstrong> — Quién es tu cliente como sistema vivo: el negocio, el equipo, el líder.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:18px;background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:16px 18px\">\n        <span style=\"flex:none;width:52px;height:52px;border-radius:8px;background:#0B6FBF;color:#fff;font-family:'Archivo Black',sans-serif;font-size:26px;display:flex;align-items:center;justify-content:center\">R<\u002Fspan>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">REALITY<\u002Fstrong> — El paisaje real: mercado, presiones, recursos, cultura y obstáculos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:18px;background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:16px 18px\">\n        <span style=\"flex:none;width:52px;height:52px;border-radius:8px;background:#F5C400;color:#091A30;font-family:'Archivo Black',sans-serif;font-size:26px;display:flex;align-items:center;justify-content:center\">I<\u002Fspan>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">INTERACTIONS<\u002Fstrong> — Los agentes y conexiones que mueven el sistema por dentro.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:18px;background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:16px 18px\">\n        <span style=\"flex:none;width:52px;height:52px;border-radius:8px;background:#00963F;color:#fff;font-family:'Archivo Black',sans-serif;font-size:26px;display:flex;align-items:center;justify-content:center\">S<\u002Fspan>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">STRATEGY<\u002Fstrong> — Escenarios y Principios Guía Simples que el cliente o equipo se lleva.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px\">\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:26px\">\n        <p style=\"margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.12em;color:#0B6FBF\">MARCO 1<\u002Fp>\n        <h3 style=\"margin:0 0 12px;font-size:19px;font-weight:800;color:#091A30;line-height:1.3\">El sistema operativo del negocio<\u002Fh3>\n        <p style=\"margin:0 0 16px;font-size:15.5px;line-height:1.62;color:#33415C\">EOS · Los 6 componentes (Gino Wickman): Vision, People, Data, Issues, Process y Traction, organizados en dimensión estratégica y operativa.<\u002Fp>\n        <div style=\"background:#F7F8FA;border-left:4px solid #F5C400;border-radius:0 8px 8px 0;padding:16px\">\n          <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#475467\"><strong style=\"color:#091A30\">EOS como mapa, no como implementación.<\u002Fstrong> Aquí no formamos implementadores de EOS. Aprendes a usar los 6 componentes como radiografía: acompañas al cliente a ver cuál está débil y qué quiere hacer al respecto. Esa distinción preserva la postura de Coach y hace legítimo el uso del marco.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:26px\">\n        <p style=\"margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.12em;color:#7B2E8E\">MARCO 2<\u002Fp>\n        <h3 style=\"margin:0 0 12px;font-size:19px;font-weight:800;color:#091A30;line-height:1.3\">La postura del Coach<\u002Fh3>\n        <p style=\"margin:0 0 16px;font-size:15.5px;line-height:1.62;color:#33415C\">Un cliente o un equipo no piensa mejor porque le hagas mejores preguntas. Piensa mejor por cómo lo tratas mientras piensa. Ese es el hallazgo de Nancy Kline (Thinking Environment · 10 componentes) y la razón por la que este marco cierra el modelo.<\u002Fp>\n        <div style=\"background:#F7F8FA;border-left:4px solid #7B2E8E;border-radius:0 8px 8px 0;padding:16px\">\n          <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#475467\"><strong style=\"color:#091A30\">Por qué Kline cambia la forma de facilitar.<\u002Fstrong> Los 10 componentes no son técnicas de comunicación: son precondiciones que tú sostienes para que el otro piense mejor. La mayoría de Coaches en formación descubren aquí que su mayor obstáculo no es la falta de preguntas, sino la prisa por llegar al insight.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#fff;padding:clamp(48px,8vw,92px) 18px\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <h2 style=\"margin:0 0 30px;font-family:'Archivo Black',sans-serif;font-size:clamp(26px,5.2vw,42px);line-height:1.08;color:#091A30\">Tu viaje de 3 días · 24 horas<\u002Fh2>\n\n    <div style=\"border-radius:12px;overflow:hidden;border:1px solid #E4E7EC;background:#0E2440;aspect-ratio:3/2;max-height:280px;display:flex;flex-direction:column;margin-bottom:28px\">\n      <div style=\"display:flex;height:10px;width:100%\">\n        <div style=\"flex:1;background:#E3000F\"><\u002Fdiv><div style=\"flex:1;background:#0B6FBF\"><\u002Fdiv><div style=\"flex:1;background:#00963F\"><\u002Fdiv>\n      <\u002Fdiv>\n      <img src=\"assets\u002Ffoto-3dias.jpg\" alt=\"Equipo trabajando con LEGO Serious Play durante los 3 días presenciales\" style=\"flex:1 1 auto;width:100%;height:100%;min-height:0;object-fit:cover;object-position:center;display:block\" loading=\"lazy\">\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px\">\n      <article style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-top:6px solid #E3000F;border-radius:10px;padding:26px\">\n        <p style=\"margin:0 0 6px;font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:.1em;color:#E3000F\">DÍA 1<\u002Fp>\n        <h3 style=\"margin:0 0 8px;font-size:18px;font-weight:800;color:#091A30;line-height:1.28\">BUSINESS COACHING MODEL INTEGRADO™<\u002Fh3>\n        <p style=\"margin:0 0 18px;font-size:15px;font-style:italic;line-height:1.55;color:#667085\">Aprendes a leer una empresa como sistema y a trabajar tu propio caso real.<\u002Fp>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 1 ·<\u002Fstrong> Apertura, origen de la metodología y encuadre del Marco Sistémico.<\u002Fli>\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 2 ·<\u002Fstrong> Dimensión Operativa: construyes personas, problemas y procesos del negocio.<\u002Fli>\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 3 ·<\u002Fstrong> Dimensión Estratégica: construyes visión, métricas y tracción real.<\u002Fli>\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 4 ·<\u002Fstrong> Dimensión Humana: practicas en tríadas y aterrizas tu primer Principio Guía.<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-top:6px solid #0B6FBF;border-radius:10px;padding:26px\">\n        <p style=\"margin:0 0 6px;font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:.1em;color:#0B6FBF\">DÍA 2<\u002Fp>\n        <h3 style=\"margin:0 0 8px;font-size:18px;font-weight:800;color:#091A30;line-height:1.28\">TEAM COACHING MODEL INTEGRADO™<\u002Fh3>\n        <p style=\"margin:0 0 18px;font-size:15px;font-style:italic;line-height:1.55;color:#667085\">Vives el proceso desde dentro: eres parte de un equipo en proceso, no un observador.<\u002Fp>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 1 ·<\u002Fstrong> El Team Coaching Model Integrado™ y qué lo diferencia del coaching de negocios.<\u002Fli>\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 2 ·<\u002Fstrong> Identidad colectiva: el equipo negocia pieza por pieza su modelo compartido.<\u002Fli>\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 3 ·<\u002Fstrong> Paisaje y agentes: qué fuerzas mueven al equipo por dentro y por fuera.<\u002Fli>\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 4 ·<\u002Fstrong> El Mercado de Tensiones: el equipo elige sus propios escenarios y aterriza los principios guía.<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-top:6px solid #00963F;border-radius:10px;padding:26px\">\n        <p style=\"margin:0 0 6px;font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:.1em;color:#00963F\">DÍA 3<\u002Fp>\n        <h3 style=\"margin:0 0 8px;font-size:18px;font-weight:800;color:#091A30;line-height:1.28\">DIÁLOGOS Y CERTIFICACIÓN<\u002Fh3>\n        <p style=\"margin:0 0 18px;font-size:15px;font-style:italic;line-height:1.55;color:#667085\">Dominas las conversaciones difíciles y demuestras lo aprendido facilitando.<\u002Fp>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 1 ·<\u002Fstrong> Feedback y feedforward: las dos técnicas y el criterio para elegir cuál usar.<\u002Fli>\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 2 ·<\u002Fstrong> Laboratorio de diálogo: los 10 componentes puestos a prueba en conversación real.<\u002Fli>\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 3 ·<\u002Fstrong> Preparación de tu demo de certificación con acompañamiento del Trainer.<\u002Fli>\n          <li style=\"font-size:14.5px;line-height:1.55;color:#33415C\"><strong style=\"color:#091A30\">Bloque 4 ·<\u002Fstrong> Demo evaluada, devolución en formato coaching y entrega del Certificado.<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:24px;background:#091A30;border-radius:10px;padding:24px 26px;color:#fff;display:flex;flex-wrap:wrap;gap:14px;align-items:baseline\">\n      <h3 style=\"margin:0;font-family:'Archivo Black',sans-serif;font-size:14px;letter-spacing:.1em;color:#F5C400\">HORARIO<\u002Fh3>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.85);flex:1;min-width:260px\">De 9:00 a 18:30 hrs los tres días. Cuatro bloques diarios de trabajo efectivo, dos recesos y una hora de almuerzo. Total: 24 horas netas de formación práctica.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#F7F8FA;padding:clamp(48px,8vw,92px) 18px;border-top:1px solid #EAECF0\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <h2 style=\"margin:0 0 16px;font-family:'Archivo Black',sans-serif;font-size:clamp(26px,5.2vw,42px);line-height:1.08;color:#091A30\">Qué te llevas al salir<\u002Fh2>\n    <p style=\"margin:0 0 30px;font-size:clamp(16px,3.1vw,18px);line-height:1.65;color:#33415C;max-width:70ch\">Más allá del certificado, sales con material tangible listo para tu práctica profesional desde la semana siguiente.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:22px;display:flex;gap:13px\">\n        <span style=\"flex:none;width:26px;height:26px;border-radius:6px;background:#00963F;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center\">✓<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#33415C\"><strong style=\"color:#091A30\">Tu caso resuelto.<\u002Fstrong> Trabajas un cliente o negocio real durante los tres días. Sales con una intervención avanzada, no con un ejercicio ficticio.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:22px;display:flex;gap:13px\">\n        <span style=\"flex:none;width:26px;height:26px;border-radius:6px;background:#00963F;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center\">✓<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#33415C\"><strong style=\"color:#091A30\">Batería de preguntas.<\u002Fstrong> Más de 90 preguntas del COACH IRIS™ organizadas por fase y componente, listas para tu próxima sesión.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:22px;display:flex;gap:13px\">\n        <span style=\"flex:none;width:26px;height:26px;border-radius:6px;background:#00963F;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center\">✓<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#33415C\"><strong style=\"color:#091A30\">Galería de modelos.<\u002Fstrong> Fotografía de cada modelo que construyas: tu biblioteca visual de referencia.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:22px;display:flex;gap:13px\">\n        <span style=\"flex:none;width:26px;height:26px;border-radius:6px;background:#00963F;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center\">✓<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#33415C\"><strong style=\"color:#091A30\">Manual del Participante.<\u002Fstrong> Cuaderno de trabajo impreso con la teoría base, consignas de construcción y espacios de reflexión.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:22px;display:flex;gap:13px\">\n        <span style=\"flex:none;width:26px;height:26px;border-radius:6px;background:#00963F;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center\">✓<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#33415C\"><strong style=\"color:#091A30\">Principios Guía.<\u002Fstrong> Tus propios Principios Guía Simples destilados durante la certificación, como brújula de tu práctica.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:22px;display:flex;gap:13px\">\n        <span style=\"flex:none;width:26px;height:26px;border-radius:6px;background:#00963F;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center\">✓<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#33415C\"><strong style=\"color:#091A30\">Certificado Internacional Primera Generación.<\u002Fstrong> Acreditación Business &amp; Team Coaching con la Metodología LEGO® SERIOUS PLAY®, evaluada con rúbrica de tres ejes.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:26px;background:linear-gradient(180deg,#FFFBEB,#FEF3C7);border:1px solid #F5C400;border-left:6px solid #F5C400;border-radius:10px;padding:26px\">\n      <h3 style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.04em;color:#8A6100\">BONO EXCLUSIVO DE LA COHORTE FUNDADORA<\u002Fh3>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.62;color:#3F3011\">Sesión Grupal de Posicionamiento Comercial post-certificación: cómo empaquetar, cotizar y vender tu primer taller o proceso de coaching con la metodología. Porque certificarte es la mitad del camino — la otra mitad es convertirlo en ingresos. Solo para la Primera Generación.<\u002Fp>\n    <\u002Fdiv>\n\n    <p style=\"margin:30px 0 0;font-size:clamp(16px,3.1vw,19px);font-style:italic;line-height:1.6;color:#091A30;border-left:4px solid #E3000F;padding-left:18px;max-width:72ch\">La evidencia de tu transformación no está en las palabras. Está en la diferencia entre el modelo que construyes el primer día y el que construyes el último.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"inversion\" style=\"background:#091A30;color:#fff;padding:clamp(48px,8vw,92px) 18px\">\n  <div style=\"max-width:1000px;margin:0 auto\">\n    <div style=\"display:flex;height:10px;width:120px;margin-bottom:26px;border-radius:2px;overflow:hidden\">\n      <div style=\"flex:1;background:#F5C400\"><\u002Fdiv><div style=\"flex:1;background:#E3000F\"><\u002Fdiv><div style=\"flex:1;background:#00963F\"><\u002Fdiv><div style=\"flex:1;background:#0B6FBF\"><\u002Fdiv>\n    <\u002Fdiv>\n    <h2 style=\"margin:0 0 26px;font-family:'Archivo Black',sans-serif;font-size:clamp(26px,5.2vw,42px);line-height:1.08\">Tu inversión · Exclusiva para Fundadores<\u002Fh2>\n\n    <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:26px;margin-bottom:26px\">\n      <h3 style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.05em;color:#F5C400\">HAGAMOS LA MATEMÁTICA PRIMERO<\u002Fh3>\n      <p style=\"margin:0 0 12px;font-size:15.5px;line-height:1.65;color:rgba(255,255,255,.84)\">En el mercado latinoamericano, un solo taller corporativo con LEGO® SERIOUS PLAY® se cotiza típicamente entre $1.500 y $4.000 USD según alcance y cliente. Una sesión de Coaching de Equipo de 4 horas se cotiza entre $1.200 y $2.000 USD.<\u002Fp>\n      <p style=\"margin:0;font-size:16.5px;line-height:1.6;font-weight:700;color:#fff\">Recuperas tu inversión completa con tu primer cliente. El resto es margen sobre una habilidad que te acompaña toda la carrera.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;align-items:stretch\">\n      <div style=\"background:#fff;color:#091A30;border-radius:12px;padding:28px;border:3px solid #F5C400;position:relative\">\n        <span style=\"position:absolute;top:-13px;left:22px;background:#F5C400;color:#091A30;font-family:'Archivo Black',sans-serif;font-size:11px;letter-spacing:.09em;padding:6px 12px;border-radius:5px\">PRECIO FUNDADOR<\u002Fspan>\n        <p style=\"margin:8px 0 4px;font-size:12px;font-weight:800;letter-spacing:.1em;color:#B54708\">PRIMERA GENERACIÓN<\u002Fp>\n        <p style=\"margin:0;font-family:'Archivo Black',sans-serif;font-size:clamp(42px,8vw,58px);line-height:1\">$970<span style=\"font-size:20px;color:#667085\"> USD<\u002Fspan><\u002Fp>\n        <p style=\"margin:8px 0 0;font-size:15px;font-weight:600;color:#33415C\">Reservando antes del 15 de agosto<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:28px;display:flex;flex-direction:column;justify-content:center\">\n :rgba(255,255,255,.08);color:#fff\">Prefiero transferencia bancaria (sin recargo)<\u002Fa>\n      <p style=\"margin:0;text-align:center;font-size:13px;line-height:1.55;color:rgba(255,255,255,.55)\">Por seguridad, los datos para transferencia bancaria se comparten por WhatsApp o email al confirmar tu cupo.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#fff;padding:clamp(48px,8vw,92px) 18px\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <h2 style=\"margin:0 0 32px;font-family:'Archivo Black',sans-serif;font-size:clamp(26px,5.2vw,42px);line-height:1.08;color:#091A30\">Quién te va a entrenar<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:34px;align-items:start\">\n      <div style=\"border-radius:12px;overflow:hidden;border:1px solid #E4E7EC;background:#0E2440;aspect-ratio:4/5;display:flex;flex-direction:column;max-width:420px\">\n        <div style=\"display:flex;height:12px;width:100%\">\n          <div style=\"flex:1;background:#7B2E8E\"><\u002Fdiv><div style=\"flex:1;background:#E3000F\"><\u002Fdiv><div style=\"flex:1;background:#F5C400\"><\u002Fdiv><div style=\"flex:1;background:#0B6FBF\"><\u002Fdiv>\n        <\u002Fdiv>\n        <img src=\"assets\u002Ffoto-betsy.jpg\" alt=\"Betsy Martínez Montero, Trainer de la certificación\" style=\"flex:1 1 auto;width:100%;height:100%;min-height:0;object-fit:cover;object-position:center 22%;display:block\" loading=\"lazy\">\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"margin:0;font-family:'Archivo Black',sans-serif;font-size:clamp(24px,4.6vw,34px);line-height:1.08;color:#091A30\">BETSY MARTÍNEZ MONTERO<\u002Fh3>\n        <p style=\"margin:10px 0 22px;font-size:16px;font-style:italic;line-height:1.5;color:#7B2E8E;font-weight:600\">Autora y Speaker “Re-humanizando la Productividad” · Estratega en Productividad Consciente<\u002Fp>\n        <p style=\"margin:0 0 14px;font-size:16px;line-height:1.65;color:#33415C\">Coach Corporativa en Negocios, Facilitadora y Trainer para Latinoamérica con más de 15 años de trayectoria acompañando procesos de liderazgo, equipos y productividad consciente en organizaciones de la región.<\u002Fp>\n        <p style=\"margin:0 0 14px;font-size:16px;line-height:1.65;color:#33415C\">Desde 2015 lidera, con Humanos con Recursos, certificaciones internacionales en metodologías de aprendizaje activo, y lleva más de 9 años promoviendo facilitadores en LEGO® SERIOUS PLAY® en Latinoamérica. Esta certificación no es su primer programa: es la destilación de casi una década de experiencia en un modelo propio.<\u002Fp>\n        <p style=\"margin:0 0 22px;font-size:16px;line-height:1.65;color:#33415C\">Creadora del IRIS Coaching Model™, del Marco Sistémico de Business Coaching Integrado™ y del Team Coaching Model Integrado™, los tres marcos que estructuran esta certificación.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px\">\n          <span style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#475467\">Psicología Positiva<\u002Fspan>\n          <span style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#475467\">Indagación Apreciativa<\u002Fspan>\n          <span style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#475467\">Coaching Apreciativo<\u002Fspan>\n          <span style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#475467\">Thinking Partner<\u002Fspan>\n          <span style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#475467\">Coaching Corporativo, Ejecutivo y de Equipos<\u002Fspan>\n          <span style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#475467\">Coach de Supervisión<\u002Fspan>\n          <span style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#475467\">Agile Coach<\u002Fspan>\n        <\u002Fdiv>\n\n        <h4 style=\"margin:0 0 14px;font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.04em;color:#091A30\">SU ENFOQUE COMO TRAINER<\u002Fh4>\n        <div style=\"display:flex;flex-direction:column;gap:13px;margin-bottom:26px\">\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#33415C;border-left:3px solid #E3000F;padding-left:14px\"><strong style=\"color:#091A30\">Rigor metodológico.<\u002Fstrong> Anclada en el origen académico de la metodología — Roos y Victor en el IMD, 1996 — y en el modelo Open Source liberado por LEGO Group en 2010.<\u002Fp>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#33415C;border-left:3px solid #F5C400;padding-left:14px\"><strong style=\"color:#091A30\">Aprendizaje activo real.<\u002Fstrong> Ochenta por ciento de construcción, veinte por ciento de teoría.<\u002Fp>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#33415C;border-left:3px solid #00963F;padding-left:14px\"><strong style=\"color:#091A30\">Acompañamiento cercano.<\u002Fstrong> Cupo limitado deliberadamente para acompañar durante el proceso y después de él.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#F7F8FA;border:1px solid #E4E7EC;border-top:5px solid #7B2E8E;border-radius:10px;padding:24px\">\n          <h4 style=\"margin:0 0 12px;font-family:'Archivo Black',sans-serif;font-size:14px;letter-spacing:.05em;color:#7B2E8E\">SU COMPROMISO CONTIGO<\u002Fh4>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.62;color:#33415C\">Que salgas de estos tres días con un método que puedas usar el lunes siguiente. No con apuntes: con una estructura probada, tu c
