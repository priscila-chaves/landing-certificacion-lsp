# El build genera index.html desde el archivo de Claude Design (ver build.py).
# Para publicar una nueva versión del diseño basta reemplazar los archivos
# fuente (Landing Certificacion LSP.dc.html, .image-slots.state.json, assets/)
# y hacer push — no hay que editar nada más.
[build]
  publish = "."
  command = "python3 build.py"
